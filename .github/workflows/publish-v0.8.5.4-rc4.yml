name: Publish v0.8.5.4 RC4 prerelease

# RC4 corrected classic-background/status-meter test build
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.8.5.4-rc4.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.8.5.4-rc4
      RC_SHA: b2053de8ee7e017e94f27634b6a33d70b989f1e0

    steps:
      - name: Check existing prerelease
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG already exists; build will still run so the test BIN can be downloaded as an Actions artifact."
          fi

      - name: Checkout corrected RC4 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build corrected RC4 firmware
        run: pio run -e m5stack-cardputer-adv

      - name: Verify merged BIN
        shell: bash
        run: |
          test -f TamaPoke-CardputerADV.bin
          sha256sum TamaPoke-CardputerADV.bin
          ls -lh TamaPoke-CardputerADV.bin

      - name: Upload RC4 test BIN artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-CardputerADV-v0.8.5.4-RC4-firmware
          path: TamaPoke-CardputerADV.bin
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease if needed
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG already exists; skipping duplicate publish."
            exit 0
          fi
          gh release create "$TAG" \
            TamaPoke-CardputerADV.bin#TamaPoke-CardputerADV.bin \
            --repo "${{ github.repository }}" \
            --target "$RC_SHA" \
            --title "TamaPoke Cardputer ADV v0.8.5.4 RC4" \
            --prerelease \
            --notes "Corrected RC4 for Cardputer ADV hardware testing. Restores the classic pre-RC3 TamaPoke backgrounds and original graphical FOOD/JOY/ENE/HYG meters, removes raw numeric need boxes, and hard-hides the battery/SAVE overlays in terrarium idle mode. It retains the timeout fix, G0 screen toggle, battery HUD in normal UI, About/version screen, Recent Events, display recovery, richer PMD personality, Gastly/Haunter/Gengar effects, evolution polish, improved Pokédex detail and shiny effects. v0.7 pet save journals remain compatible."
