name: Publish TamaPoke Cardputer ADV v0.9.0

on:
  push:
    branches: [main]
    paths:
      - "RELEASE_NOTES_v0.9.0.md"
      - "scripts/**"
      - "src/**"
      - "include/**"
      - "generated/**"
      - "platformio.ini"
      - "partitions.csv"
      - ".github/workflows/publish-v0.9.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Stop if v0.9.0 is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.9.0 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v0.9.0 already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        if: steps.existing.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        if: steps.existing.outputs.exists != 'true'
        run: python -m pip install --upgrade platformio

      - name: Build hardware-approved firmware
        if: steps.existing.outputs.exists != 'true'
        run: pio run -e m5stack-cardputer-adv

      - name: Prepare public release assets
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          test -f TamaPoke-CardputerADV-v0.9.0.bin
          mkdir -p release-assets
          cp TamaPoke-CardputerADV-v0.9.0.bin release-assets/
          cd release-assets
          sha256sum TamaPoke-CardputerADV-v0.9.0.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish v0.9.0 GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.9.0 \
            release-assets/TamaPoke-CardputerADV-v0.9.0.bin \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "TamaPoke Cardputer ADV v0.9.0" \
            --notes-file RELEASE_NOTES_v0.9.0.md
