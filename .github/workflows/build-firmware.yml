name: Build Cardputer ADV Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "generated/**"
      - "scripts/**"
      - "platformio.ini"
      - "partitions.csv"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "generated/**"
      - "scripts/**"
      - "platformio.ini"
      - "partitions.csv"
      - ".github/workflows/build-firmware.yml"
      - "README.md"
      - "PORT_VERSION.txt"
      - "docs/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e m5stack-cardputer-adv

      - name: Collect firmware files
        shell: bash
        run: |
          mkdir -p firmware-output
          cp .pio/build/m5stack-cardputer-adv/firmware.bin firmware-output/firmware-app.bin
          if [ -f TamaPoke-CardputerADV-v0.8.5.4-firmware.bin ]; then
            cp TamaPoke-CardputerADV-v0.8.5.4-firmware.bin firmware-output/
          fi
          if [ -f TamaPoke-CardputerADV.bin ]; then
            cp TamaPoke-CardputerADV.bin firmware-output/
          fi
          ls -lh firmware-output

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-CardputerADV-v0.8.5.4-firmware
          path: firmware-output/*
          if-no-files-found: error
          retention-days: 30
