name: Publish v0.8.5.4 RC3 prerelease

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.8.5.4-rc3.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.8.5.4-rc3
      RC_SHA: 3d319cc2120f442655f0a6a1721a58634cc340f6

    steps:
      - name: Stop if prerelease already exists
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi

      - name: Checkout tested RC3 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build RC3 firmware
        run: pio run -e m5stack-cardputer-adv

      - name: Verify merged BIN
        shell: bash
        run: |
          test -f TamaPoke-CardputerADV.bin
          sha256sum TamaPoke-CardputerADV.bin
          ls -lh TamaPoke-CardputerADV.bin

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG already exists; skipping duplicate publish."
            exit 0
          fi
          gh release create "$TAG" \
            TamaPoke-CardputerADV.bin#TamaPoke-CardputerADV.bin \
            --repo "${{ github.repository }}" \
            --target "$RC_SHA" \
            --title "TamaPoke Cardputer ADV v0.8.5.4 RC3" \
            --prerelease \
            --notes "Release candidate for hardware testing on M5Stack Cardputer ADV. Includes the v0.8.5.4 OG polish work: display-timeout fix, G0 backlight toggle, compact battery HUD (hidden in terrarium mode), save indicator, About/version screen, Recent Events, display recovery, improved Home HUD, richer PMD personality actions, expanded biomes, Gastly/Haunter/Gengar atmosphere, improved evolution sequence, Pokédex detail overhaul and shiny effects. Pet saves remain compatible with the v0.7 two-slot journal. This is a prerelease; final v0.8.5.4 will be published after hardware validation."
