name: Assemble README showcase

on:
  push:
    paths:
      - 'docs/.showcase_chunks/hq_*.txt'
      - '.github/workflows/assemble-showcase.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild showcase image
        shell: bash
        run: |
          # The source collage is stored as text chunks so the exact binary can be reconstructed in CI.
          cat docs/.showcase_chunks/hq_*.txt > /tmp/showcase.b64
          base64 -d /tmp/showcase.b64 > docs/tamapoke-cardputer-adv-showcase.webp
          test "$(wc -c < docs/tamapoke-cardputer-adv-showcase.webp)" -eq 91482

      - name: Commit rebuilt image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tamapoke-cardputer-adv-showcase.webp
          if git diff --cached --quiet; then
            echo "Showcase image already up to date"
            exit 0
          fi
          git commit -m "Rebuild full-quality README showcase image"
          git push
