name: Publish v0.8.5.4 stable release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.8.5.4.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.8.5.4
      RELEASE_SHA: 4e5b30a35715efc2d6631ecd7de147235d14435d

    steps:
      - name: Checkout tested RC5 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build stable firmware
        run: pio run -e m5stack-cardputer-adv

      - name: Verify merged BIN
        shell: bash
        run: |
          test -f TamaPoke-CardputerADV.bin
          sha256sum TamaPoke-CardputerADV.bin
          ls -lh TamaPoke-CardputerADV.bin

      - name: Upload stable firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-CardputerADV-v0.8.5.4-firmware
          path: TamaPoke-CardputerADV.bin
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable GitHub release
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to overwrite the published stable release."
            exit 1
          fi
          gh release create "$TAG" \
            TamaPoke-CardputerADV.bin#TamaPoke-CardputerADV.bin \
            --repo "${{ github.repository }}" \
            --target "$RELEASE_SHA" \
            --title "TamaPoke Cardputer ADV v0.8.5.4" \
            --latest \
            --notes "Stable Cardputer ADV release promoted from the hardware-tested RC5 source. Includes the display-timeout race fix, G0 screen toggle, compact battery HUD and low-battery warning, clean terrarium mode, classic habitat backgrounds and graphical FOOD/JOY/ENE/HYG meters, save indicator, About/version screen, Recent Events with hardened history handling, Reset Display recovery, richer PMD personality actions, enhanced biome ambience, Gastly/Haunter/Gengar atmosphere, evolution polish, improved Pokédex details and shiny effects. Existing v0.7 pet save journals remain compatible."
